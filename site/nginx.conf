# =============================================================================
# nginx config cho LUBYLAB site — port 5502
# Dùng:
#   - Windows:  copy nội dung server{} vào nginx/conf/nginx.conf (trong http{}),
#               hoặc:  nginx -c D:/Projects/QR_projects/site/nginx.conf
#   - Linux:    đặt vào /etc/nginx/conf.d/lubylab.conf rồi  nginx -s reload
#
# Vì sao hết out-RAM:
#   sendfile on  -> nhân HĐH stream file thẳng disk -> socket, KHÔNG nạp vào RAM.
#   cache header -> khách quay lại không tải lại ảnh (giảm tải mạnh).
# =============================================================================

server {
    listen      5502;
    server_name localhost;

    # Trỏ tới thư mục site/. Windows dùng dấu / (vd D:/Projects/QR_projects/site).
    root  D:/Projects/QR_projects/site;
    index index.html;

    # --- Streaming: RAM cố định bất kể số khách đồng thời ---
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 30;

    # --- Nén cho HTML/CSS/JS (ảnh .webp đã nén sẵn, không nén lại) ---
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # --- Cache dài cho ảnh & asset (tên file ổn định) ---
    location /data/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /logo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS/JS: cache 1 ngày (đổi tên file hoặc thêm ?v= khi deploy bản mới)
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # HTML: luôn revalidate để nội dung mới hiện ngay
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Báo đúng MIME cho webp (nginx mới đã có sẵn, thêm để chắc chắn)
    location ~* \.webp$ {
        types { image/webp webp; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
